[project]
name = "books2scrape"
version = "0.1.0"
description = "Veille concurrentielle Bouquineo : collecte books.toscrape.com vers PostgreSQL"
readme = "README.md"
authors = [
    { name = "ElieLECAS", email = "elielecas00@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
books2scrape = "books2scrape.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
